name: C++ Environment Smoke Test

on:
  push:
    paths:
      - '00-cpp-basics/01-environment/**'
      - '.github/workflows/cpp-environment.yml'
  pull_request:
    paths:
      - '00-cpp-basics/01-environment/**'
      - '.github/workflows/cpp-environment.yml'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and debugger
        run: sudo apt-get update && sudo apt-get install -y g++ gdb
      - name: Verify compiler
        run: g++ --version
      - name: Compile and run C++17 examples
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for source in \
            00-cpp-basics/01-environment/hello.cpp \
            00-cpp-basics/01-environment/exercise.cpp \
            00-cpp-basics/01-environment/debugger_walkthrough.cpp; do
            binary="$tmp/$(basename "$source" .cpp)"
            g++ -std=c++17 -Wall -Wextra -pedantic -g "$source" -o "$binary"
            "$binary"
          done
      - name: Smoke-test debugger breakpoint and inspection
        shell: bash
        run: |
          set -euo pipefail
          src="00-cpp-basics/01-environment/debugger_walkthrough.cpp"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          binary="$tmp/debugger_walkthrough"
          output="$tmp/gdb-output.txt"

          g++ -std=c++17 -Wall -Wextra -pedantic -g "$src" -o "$binary"
          gdb --batch --quiet \
            -ex 'set pagination off' \
            -ex 'break calculateDiscount' \
            -ex 'run' \
            -ex 'print price' \
            -ex 'print discountPercent' \
            -ex 'backtrace' \
            -ex 'continue' \
            "$binary" > "$output" 2>&1
          cat "$output"

          grep -Fq 'Breakpoint 1, calculateDiscount' "$output"
          grep -Fq '$1 = 1200' "$output"
          grep -Fq '$2 = 15' "$output"
          grep -Fq 'main ()' "$output"
      - name: Verify separate compilation and linking
        shell: bash
        run: |
          set -euo pipefail
          dir="00-cpp-basics/01-environment"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          g++ -std=c++17 -Wall -Wextra -pedantic -g -c "$dir/linking-demo/greeter.cpp" -o "$tmp/greeter.o"
          g++ -std=c++17 -Wall -Wextra -pedantic -g -c "$dir/linking-demo/main.cpp" -o "$tmp/main.o"
          g++ "$tmp/main.o" "$tmp/greeter.o" -o "$tmp/linking-demo"
          "$tmp/linking-demo" | grep -Fx 'Hello, DSA learner!'
      - name: Verify debugger is installed
        run: gdb --version
